<main class="popup" [class]="theme()">

  <h1>Log in to Pinboard</h1>

  <p>You must log in to Pinboard first using the API token
    that you can find on your
    <a href="#" (click)="openPasswordPage()">Pinboard password page</a>.</p>

    <form (submit)="submit($event)">
      <div>
        @if (!checking()) {
          <label for="token">
            @if (!error()) {
              <span>Please enter your API token:</span>
            }
            @if (error()) {
              <span class="error">Invalid API token, please re-enter:</span>
            }
          </label>
        }
        @if (checking()) {
          <label><span class="info">Trying to log in
          with this API token...</span></label>
        }
      </div>
      <div>
        <input id="token" type="text" placeholder="API Token" autofocus [formField]="form.token">
        <button type="submit" [disabled]="checking() || !form().valid()">
          Log in
        </button>
      </div>
    </form>

  </main>
